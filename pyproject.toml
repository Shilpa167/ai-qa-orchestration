[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-service-desk"
version = "0.1.0"
description = "Week 1 starter: a deterministic IT service desk API for the AI QA Orchestration program."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    # Lets jsonschema's FormatChecker actually check "format": "date-time".
    # Without it, date-time formats are silently skipped.
    "rfc3339-validator>=0.1.4,<1.0",
]
# Live mode only (Day 3 lab and Day 4). Mock, replay, the clinic and every default test run
# work without it. Install with: python -m pip install -e ".[dev,live]"
live = [
    "openai>=3.33,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*", "day3_lab*", "training_day4*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
